<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}}</title>
    <link rel="icon" href="icon.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d1215;
        color: #dbe2d3;
        font:
          15px/1.5 system-ui,
          sans-serif;
        overflow: hidden;
      }
      main {
        display: grid;
        place-items: center;
        height: 100%;
      }
      /* The game draws at 400 x 240; scale it up sharply to fit the page. */
      canvas {
        display: block;
        width: min(100vw, calc(100vh * 5 / 3), {{WIDTH}}px) !important;
        height: auto !important;
        aspect-ratio: 5 / 3;
        image-rendering: pixelated;
        background: #000;
        outline: none;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgb(13 18 21 / 0.85);
      }
      #overlay[hidden] {
        display: none;
      }
      #overlay div {
        text-align: center;
        padding: 16px;
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
        margin: 0 0 16px;
      }
      button {
        font: inherit;
        font-weight: 600;
        color: #0d1215;
        background: #e9c88a;
        border: 0;
        border-radius: 3px;
        padding: 10px 28px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #status {
        margin: 12px 0 0;
        color: #99b5ab;
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    </main>
    <div id="overlay">
      <div>
        <h1>{{TITLE}}</h1>
        <button id="play" disabled>Play</button>
        <p id="status" role="status">Loading…</p>
      </div>
    </div>
    <script>
      'use strict';
      const overlay = document.getElementById('overlay'),
        play = document.getElementById('play'),
        status = document.getElementById('status');
      function show(message) {
        overlay.hidden = false;
        status.textContent = message;
      }
      let syncing = false;
      // Copies saves from the game's file system to browser storage. The runtime calls this every
      // few seconds; the page also calls it when the player leaves.
      function eveSyncSaves() {
        if (syncing || !Module.FS) return;
        syncing = true;
        Module.FS.syncfs(false, () => (syncing = false));
      }
      function eveGameEnded() {
        eveSyncSaves();
        play.textContent = 'Play again';
        play.onclick = () => location.reload();
        show('The game has closed.');
      }
      addEventListener('pagehide', eveSyncSaves);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) eveSyncSaves();
      });
      async function load(FS, name) {
        let response = await fetch(name);
        if (!response.ok) throw Error('Cannot load ' + name);
        FS.writeFile('/' + name, new Uint8Array(await response.arrayBuffer()));
      }
      var Module = {
        canvas: document.getElementById('canvas'),
        noInitialRun: true,
        preRun: [
          () => {
            const FS = Module.FS;
            Module.addRunDependency('game-files');
            FS.mkdir('/saves');
            FS.mount(FS.filesystems.IDBFS, {}, '/saves');
            FS.syncfs(true, () =>
              Promise.all([load(FS, 'project.lota'), load(FS, 'font.pam')])
                .then(() => Module.removeRunDependency('game-files'))
                .catch((e) => show(e.message))
            );
          },
        ],
        onRuntimeInitialized() {
          play.disabled = false;
          status.textContent = '';
        },
        printErr: (text) => console.error(text),
        onAbort: () => show('The game stopped because of an error.'),
      };
      // Browsers only allow sound after the player interacts with the page, so the game starts
      // from a click.
      play.onclick = () => {
        overlay.hidden = true;
        Module.canvas.focus();
        try {
          Module.callMain([]);
        } catch (e) {
          if (e !== 'unwind') show('The game could not start: ' + e);
        }
      };
      if (location.protocol === 'file:')
        show('Open this game through a web server, or upload it to a site such as itch.io.');
    </script>
    <script src="evengine.js"></script>
  </body>
</html>
