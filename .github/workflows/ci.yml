name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs the whole suite and publishes its artifacts.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio:
    name: Studio build, tests and package
    # Build on the oldest supported Ubuntu so the package runs on glibc 2.35 and later.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config xvfb xauth python3 patchelf desktop-file-utils \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libegl-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev
      # Cache only the tarball: restoring FetchContent's stamp files as well would make CMake
      # skip extracting SDL. CMake re-checks the tarball's SHA-256 before using it.
      - name: Cache SDL3 download
        uses: actions/cache@v6
        with:
          path: build-linux/_deps/sdl3-subbuild/sdl3-populate-prefix/src/SDL3-3.2.20.tar.gz
          key: sdl3-3.2.20-tarball-${{ runner.os }}
      - name: Configure
        run: cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-linux --parallel
      - name: Test
        run: ctest --test-dir build-linux --output-on-failure
        env:
          SDL_AUDIODRIVER: dummy
      - name: Package
        run: python3 tools/package_linux.py --build build-linux --output deliverables
      - name: Check the package runs from a fresh folder
        run: |
          mkdir unpacked
          tar -xzf deliverables/*.tar.gz -C unpacked
          package=$(echo unpacked/EveNGINE-Studio-*)
          "$package/Frontier Watch/frontier-watch" --validate
          python3 editor/tests/linux_studio_test.py "$package/evengine-studio" editor/examples/Frontier-Watch.eve
          python3 editor/tests/linux_dialog_smoke_test.py "$package/evengine-studio"
      # The AppImage bundles WebKitGTK for systems where it can't be installed, like SteamOS.
      # appimagetool is pinned by checksum; the AppImage runtime only has a rolling release.
      - name: Package AppImage
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          echo "46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1  appimagetool" | sha256sum -c
          curl -fsSL -o appimage-runtime https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          sha256sum appimage-runtime
          chmod +x appimagetool
          python3 tools/package_appimage.py --build build-linux --output deliverables \
            --appimagetool appimagetool --runtime appimage-runtime
      - name: Check the AppImage runs without WebKitGTK installed
        run: |
          sudo apt-get remove -y libwebkit2gtk-4.1-0 libjavascriptcoregtk-4.1-0
          ! ldconfig -p | grep -E "libwebkit2gtk|libjavascriptcoregtk"
          image=$(echo deliverables/*.AppImage)
          chmod +x "$image"
          "$image" --version
          python3 editor/tests/linux_studio_test.py "$image" editor/examples/Frontier-Watch.eve
          python3 editor/tests/linux_dialog_smoke_test.py "$image"
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
      - uses: actions/upload-artifact@v7
        with:
          name: EveNGINE-Studio-linux-x86_64
          path: |
            deliverables/*.tar.gz
            deliverables/*.AppImage
          if-no-files-found: error

  macos:
    name: macOS Studio app and tests
    # Apple Silicon runner; the universal build also produces the unofficial Intel slice.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          SDL_AUDIODRIVER: dummy
      - name: Check the app bundle
        run: |
          version=$(sed -n 's/^project(EveNGINESDK VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          app=build/EveNGINE-Studio.app
          for binary in "$app/Contents/MacOS/EveNGINE-Studio" "$app/Contents/Resources/Runtime"; do
            archs=$(lipo -archs "$binary")
            echo "$binary: $archs"
            [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]]
          done
          for binary in "$app/Contents/MacOS/EveNGINE-Studio" "$app/Contents/Resources/Runtime"; do
            minimum=$(otool -l -arch all "$binary" | awk '/minos/ {print $2}' | sort -u)
            echo "$binary: minimum macOS $minimum"
            test "$minimum" = 12.0
          done
          test -f "$app/Contents/Frameworks/SDL3.framework/SDL3"
          test -f "$app/Contents/Resources/ui/index.html"
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "$version"
          "$app/Contents/Resources/Runtime" --project editor/examples/Frontier-Watch.eve --validate
      - name: Package
        run: |
          version=$(sed -n 's/^project(EveNGINESDK VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          name="EveNGINE-Studio-v$version-macOS"
          mkdir -p "$name/Templates" "$name/Licenses"
          ditto build/EveNGINE-Studio.app "$name/EveNGINE-Studio.app"
          cp editor/examples/*.eve "$name/Templates/"
          cp LICENSE "$name/Licenses/EveNGINE-LICENSE.txt"
          cp third_party/* "$name/Licenses/"
          cat > "$name/README.txt" <<EOF
          EveNGINE Studio $version for macOS (Apple Silicon and Intel)

          Open EveNGINE-Studio.app. It needs macOS 12 or later. Apple Silicon is officially
          supported; the Intel build is included but unofficial. The app isn't notarized, so the
          first time, Control-click it and choose Open, or allow it under System Settings ->
          Privacy & Security.

          Templates/   editable example projects (open them with Open)
          EOF
          ditto -c -k --keepParent "$name" "$name.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: EveNGINE-Studio-macOS
          path: EveNGINE-Studio-v*-macOS.zip
          if-no-files-found: error

  sanitizers:
    name: Headless engine with sanitizers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build-headless -DLOTA_DESKTOP=OFF -DLOTA_SANITIZE=ON
      - name: Build
        run: cmake --build build-headless --parallel
      - name: Test
        run: ctest --test-dir build-headless --output-on-failure

  editor:
    name: Editor model and UI tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Editor model tests
        run: node editor/tests/run-model-tests.js
      - name: Install Playwright
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Editor UI tests (1.1 features)
        run: python editor/tests/expansion_ui_test.py
        env:
          LOTA_TEST_OUTPUT: ${{ runner.temp }}/ui-tests
      - name: Keep UI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: editor-ui-screenshots
          path: ${{ runner.temp }}/ui-tests
          if-no-files-found: ignore

  format:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install formatters
        run: python -m pip install clang-format==18.1.3 black==26.5.1
      - name: C++ and Objective-C
        run: git ls-files '*.cpp' '*.hpp' '*.h' '*.m' ':!:engine/vendor/**' | xargs clang-format --dry-run --Werror
      - name: JavaScript, CSS and HTML
        run: npx --yes prettier@3.8.1 --check "**/*.{js,css,html}"
      - name: Python
        run: black --check .
